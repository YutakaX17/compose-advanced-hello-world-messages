name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: compose-advanced-hello-world-messages
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: YutakaX17/kmp-advanced-hello-world-core
          ref: ffe254219bd333395942c2736af9aa29c97e0556
          path: kmp-advanced-hello-world-core
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: YutakaX17/compose-advanced-hello-world-core
          ref: 87ab26ef9fb0bf338874d256422b49b369981c0a
          path: compose-advanced-hello-world-core
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: YutakaX17/kmp-advanced-hello-world-messages
          ref: d7ce9a21953cb9854952ce80a25df8508b606ed5
          path: kmp-advanced-hello-world-messages
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v4
      - name: Install immutable family dependencies
        run: |
          ./kmp-advanced-hello-world-core/gradlew --no-daemon -p kmp-advanced-hello-world-core -PreleaseVersion=0.1.0 :core:publishToMavenLocal
          ./compose-advanced-hello-world-core/gradlew --no-daemon -p compose-advanced-hello-world-core -PreleaseVersion=0.1.0 :ui:publishToMavenLocal
          ./kmp-advanced-hello-world-messages/gradlew --no-daemon -p kmp-advanced-hello-world-messages -PreleaseVersion=0.1.0 :messages:publishToMavenLocal
      - name: Verify tag and build package
        working-directory: compose-advanced-hello-world-messages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          RELEASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$RELEASE_VERSION"
          test "v$RELEASE_VERSION" = "$GITHUB_REF_NAME"
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_PASSWORD"
          ./gradlew --no-daemon -PreleaseVersion="$RELEASE_VERSION" spotlessCheck detekt apiCheck buildHealth check assemble publishAllPublicationsToLocalRepository
          mkdir -p release
      - name: Publish signed Maven packages
        working-directory: compose-advanced-hello-world-messages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon -PreleaseVersion="$(tr -d '[:space:]' < VERSION)" publishAllPublicationsToGitHubPackagesRepository
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: compose-advanced-hello-world-messages
          format: spdx-json
          output-file: compose-advanced-hello-world-messages/release/sbom.spdx.json
      - name: Collect artifacts and checksums
        working-directory: compose-advanced-hello-world-messages
        run: |
          mkdir -p release/maven
          cp -R messages-ui/build/repo/. release/maven/messages-ui/
          printf '{"version":"%s","commit":"%s","repository":"%s"}\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_REPOSITORY" > release/metadata.json
          tar -C release -czf release/compose-advanced-hello-world-messages-${GITHUB_REF_NAME}.tar.gz maven
          sha256sum release/*.tar.gz release/sbom.spdx.json release/metadata.json > release/SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            compose-advanced-hello-world-messages/release/*.tar.gz
            compose-advanced-hello-world-messages/release/sbom.spdx.json
            compose-advanced-hello-world-messages/release/metadata.json
            compose-advanced-hello-world-messages/release/SHA256SUMS
